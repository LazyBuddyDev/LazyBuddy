name: LazyBuddy checks

on:
  push:
    branches: [main, 'codex/lazybuddy-*']
    paths: ['apps/**', 'crates/**', 'contracts/**', 'scripts/**', 'assets/**', 'vendor/**', 'Cargo.toml', 'Cargo.lock', 'module-catalog.json', 'app-update-source.json', 'docs/updates/**', 'docs/modules/**', '.gitattributes', '.github/workflows/checks.yml']
  pull_request:
    paths: ['apps/**', 'crates/**', 'contracts/**', 'scripts/**', 'assets/**', 'vendor/**', 'Cargo.toml', 'Cargo.lock', 'module-catalog.json', 'app-update-source.json', 'docs/updates/**', 'docs/modules/**', '.gitattributes', '.github/workflows/checks.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Signing tool dependencies
        run: python -m pip install --disable-pip-version-check cryptography==46.0.3
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: lazybuddy-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Build Web host assets
        shell: pwsh
        run: |
          npm.cmd --prefix apps/desktop ci --legacy-peer-deps --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm.cmd --prefix apps/desktop run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Changed frontend checks
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FIRST_COMMIT: ${{ github.event.commits[0].id }}
        run: |
          $paths=python -B scripts/check-changes.py --base "$env:BASE_SHA" --first-commit "$env:FIRST_COMMIT" --paths-only
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $changed=@(($paths | ConvertFrom-Json) | Where-Object { $_ -like 'apps/desktop/src/*' -or $_ -like 'apps/desktop/tests/*' -or $_ -like 'apps/desktop/package*.json' })
          if ($changed.Count) {
            npm.cmd --prefix apps/desktop run check
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            npm.cmd --prefix apps/desktop test
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Changed-feature unit tests
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FIRST_COMMIT: ${{ github.event.commits[0].id }}
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B scripts/check-changes.py --base "$env:BASE_SHA" --first-commit "$env:FIRST_COMMIT"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
