<!doctype html><html lang="zh-CN"><meta charset="utf-8"><div class="app-shell" id="app"></div><script type="module">
    import {mount,unmount} from 'svelte';
    import {focusNavigation} from '/src/focus-navigation.ts';focusNavigation(document.getElementById('app'));
    import News from '/src/News.svelte';import ShortcutButton from '/src/ShortcutButton.svelte';import '/src/style.css';
    import HongguoLibrary from './hongguo-library-fixture.svelte';
    const preferences={auto_refresh:false,refresh_minutes:5,followed:[],hidden:[],order:[],default_followed:false};
    const sources=[{id:'a',name:'来源甲'},{id:'b',name:'来源乙'}];
    window.addSources=()=>sources.push({id:'c',name:'来源丙'},{id:'d',name:'来源丁'},{id:'e',name:'来源戊'});
    const stories=Array.from({length:30},(_,i)=>({title:i>3?'短标题 '+i:'这是一条用于验证超出卡片宽度后向左滚动效果的很长很长的新闻标题',url:'https://example.invalid/',badge:['Hot','New','Explosive',null][i%4]}));
    window.calls=[];window.__TAURI_INTERNALS__={invoke:async(command,args)=>{
      window.calls.push({command,...args});
      if(args.method==='sources')return sources;
      if(args.method==='state')return {preferences,cache:Object.fromEntries(sources.map(s=>[s.id,{stories,updated_ms:Date.now()}]))};
      if(args.method==='configure'){if(window.holdConfigure)await new Promise(resolve=>(window.pendingConfigures??=[]).push(resolve));Object.assign(preferences,args.args.preferences);return {preferences};}
      if(args.method==='fetch'){if(window.holdFetch)await new Promise(resolve=>(window.pendingFetches??=[]).push(resolve));return args.args.sources.map(id=>({id,ok:true,stories,updated_ms:Date.now()}));}
    }};
    let component;window.show=async(settings=false)=>{if(component)await unmount(component);component=mount(News,{target:document.querySelector('#app'),props:{active:true,settings,generation:1,notice:()=>{},settingsChange:()=>{},cardOpacity:1,setCardOpacity:()=>{}}});};
    window.showShortcut=async()=>{if(component)await unmount(component);component=mount(ShortcutButton,{target:document.querySelector('#app'),props:{label:'Ctrl+Alt+L',save:async value=>{window.savedShortcut=value;return window.saveShortcutResult!==false;},notice:text=>window.shortcutNotice=text}});};
    window.showHongguo=async()=>{
      if(component)await unmount(component);
      localStorage.setItem('lazybuddy.hongguo.player',JSON.stringify({favorites:false}));
      window.hongguoCalls=[];
      window.__TAURI_INTERNALS__.invoke=async(command,args)=>{
        window.hongguoCalls.push({command,...args});
        if(args.method==='account.restore')return {state:'signed_in',name:'样例账号'};
        if(args.method==='playback.open'&&window.fixtureVideo)return {session:1,prepared:true,episodes:[1],available_qualities:[360],resource:{url:'/tests/click-fixture.mp4',mime:'video/mp4'}};
        if(args.method==='search')return {items:[{id:'3',title:'搜索样例',episodes:12,has_cover:true}],has_more:false};
        if(args.method==='progress.read')return {history:{'1':{episode:3,time:20}}};
        if(args.method==='progress.sync')return window.progressState??{state:'signed_in',name:'样例账号',history:{'1':{episode:3,time:20}},operation:null};
        if(args.method==='cover.read'){if(window.failCover)throw new Error('cover_unavailable');if(window.holdCover)await new Promise(resolve=>(window.pendingCovers??=[]).push(resolve));return {series:args.args.series,width:1,height:1,rgba:args.args.series==='1'?'/wAA/w==':'AAD//w=='};}
        if(args.method==='favorites.read'){
          if(window.holdFavorites)await new Promise(resolve=>window.releaseFavorites=resolve);
          return {favorites_error:null,...(window.favoritesState??{state:'signed_in',name:'样例账号',operation:null,favorites:[{id:'1',title:'春日',episodes:10},{id:'2',title:'Summer',episodes:20}]})};
        }
        if(args.method==='account.status')return window.progressState??window.favoritesState??{};
        return {};
      };
      component=mount(HongguoLibrary,{target:document.querySelector('#app')});
      window.setHongguoVisible=value=>component.setVisible(value);
    };
    await window.show();
  </script></html>
