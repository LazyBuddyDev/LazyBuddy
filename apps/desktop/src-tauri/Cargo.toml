[package]
name = "lazybuddy"
version = "1.0.3"
edition = "2024"
license = "MIT"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "compression", "config-json5", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lazybuddy-module-contract = { path = "../../../crates/module-contract" }
lazybuddy-service-client = { path = "../../../crates/service-client" }
lazybuddy-module-manager = { path = "../../../crates/module-manager" }
lazybuddy-host-control = { path = "../../../crates/host-control" }
lazybuddy-app-updater = { path = "../../../crates/app-updater" }
tokio = { version = "1", features = ["sync", "time"] }
futures = "0.3"
open = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
